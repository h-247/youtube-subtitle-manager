name: Probe YouTube subtitles

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: YouTube video ID to probe
        required: true
        default: shvyD_-yy-U
      player_client:
        description: yt-dlp YouTube player client
        type: choice
        options:
          - default
          - web_embedded
        default: default

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VIDEO_ID: ${{ inputs.video_id }}
      PLAYER_CLIENT: ${{ inputs.player_client }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.x'
      - name: Install current yt-dlp
        run: python -m pip install --upgrade 'yt-dlp[default]'
      - name: Try English manual and auto captions
        env:
          YOUTUBE_COOKIE_JSON: ${{ secrets.YOUTUBE_COOKIE_JSON }}
        run: python scripts/probe_youtube_subtitles.py
